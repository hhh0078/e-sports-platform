<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2076" viewBox="0 0 1600 2076" role="img" aria-label="开机电竞项目功能说明"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#25845b"/></marker></defs><style>text{font-family:"Hiragino Sans GB","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f3f5f1"/><rect x="0" y="0" width="1600" height="302" rx="0" fill="#153e2d" stroke="none" stroke-width="2"/><rect x="72" y="54" width="66" height="66" rx="14" fill="#75d4a8" stroke="none" stroke-width="2"/><text x="86" y="102" fill="#153e2d" font-size="42" font-weight="700"><tspan x="86" dy="0">开</tspan></text><text x="164" y="103" fill="#ffffff" font-size="47" font-weight="700"><tspan x="164" dy="0">开机电竞</tspan></text><text x="72" y="195" fill="#ffffff" font-size="58" font-weight="700"><tspan x="72" dy="0">资金与风控 · 功能说明</tspan></text><text x="74" y="251" fill="#c9dfd1" font-size="27" font-weight="500"><tspan x="74" dy="0">区分资金用途与付款来源，保留订单、权限和证据安全边界。</tspan></text><text x="76" y="366" fill="#607568" font-size="29" font-weight="500"><tspan x="76" dy="0">10项业务能力 · 标题与说明均来自当前源码</tspan></text><rect x="76" y="432" width="1448" height="124" rx="20" fill="#e4eee5" stroke="none" stroke-width="2"/><text x="100" y="507" fill="#25845b" font-size="58" font-weight="700"><tspan x="100" dy="0">05</tspan></text><text x="205" y="488" fill="#173e2d" font-size="39" font-weight="700"><tspan x="205" dy="0">资金与风控</tspan></text><text x="205" y="529" fill="#607568" font-size="25" font-weight="500"><tspan x="205" dy="0">区分资金用途与付款来源，保留订单、权限和证据安全边界。</tspan></text><path d="M800,556 V577 M430.5,577 H1169.5" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M430.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M1169.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><rect x="76" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">个人资产分区与资金流水</tspan></text><text x="100" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">充值、可提现收入、进行中、结算中和冻结分开</tspan><tspan x="100" dy="40">记账，流水可逐条核对。</tspan></text><rect x="815" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">钱包充值与消费余额管理</tspan></text><text x="839" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">通过微信充值并查询原支付单，充值余额仅能用</tspan><tspan x="839" dy="40">于消费，不支持提现。</tspan></text><rect x="76" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">七天售后期与订单分账</tspan></text><text x="100" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">订单锁定平台与俱乐部费率，验收后保留七天售</tspan><tspan x="100" dy="40">后期再释放可提收入。</tspan></text><rect x="815" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">收入提现与收款确认</tspan></text><text x="839" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">可提现收入提交申请，经平台审核发起转账，收</tspan><tspan x="839" dy="40">款人按微信要求确认。</tspan></text><rect x="76" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">自愿平台押金与资格展示</tspan></text><text x="100" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">自由接单无需平台押金，自愿缴纳达标后展示保</tspan><tspan x="100" dy="40">障标识，符合条件可原路退还。</tspan></text><rect x="815" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">原路退款与资金状态同步</tspan></text><text x="839" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">订单退款及押金退还追溯原付款，未知结果沿用</tspan><tspan x="839" dy="40">原单同步，避免重复处理。</tspan></text><rect x="76" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">提现逐笔来源与占用追溯</tspan></text><text x="100" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">提现审核关联原订单、付款凭证和分配金额，缺</tspan><tspan x="100" dy="40">失可靠来源不能自动出款。</tspan></text><rect x="815" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">多角色分权与隐私隔离</tspan></text><text x="839" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">平台根副管理员与组织负责人分级授权，私有资</tspan><tspan x="839" dy="40">料按账号和组织范围读取。</tspan></text><rect x="76" y="1588" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1588" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1637" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">内容后置审核与安全投影</tspan></text><text x="100" y="1699" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">图文保存后进入模型或人工队列，违规展示受限，</tspan><tspan x="100" dy="40">交易原始证据隔离保留。</tspan></text><rect x="815" y="1588" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1588" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1637" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">支付回调校验与幂等记账</tspan></text><text x="839" y="1699" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">校验微信签名、商户和金额，支付退款回调及重</tspan><tspan x="839" dy="40">试均复用业务原单。</tspan></text><path d="M76,1886 H1524" stroke="#b7cdbd" stroke-width="2"/><text x="76" y="1940" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">功能按当前源码梳理；微信支付、转账、订阅、小程序码与AI审核需完成对应正式配置。</tspan></text><text x="76" y="1983" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">节点均附功能说明；总图箭头表示业务流程，分组连接线表示能力归属。</tspan></text></svg>