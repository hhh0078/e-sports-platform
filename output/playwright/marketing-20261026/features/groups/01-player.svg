<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2076" viewBox="0 0 1600 2076" role="img" aria-label="开机电竞项目功能说明"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#25845b"/></marker></defs><style>text{font-family:"Hiragino Sans GB","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f3f5f1"/><rect x="0" y="0" width="1600" height="302" rx="0" fill="#153e2d" stroke="none" stroke-width="2"/><rect x="72" y="54" width="66" height="66" rx="14" fill="#75d4a8" stroke="none" stroke-width="2"/><text x="86" y="102" fill="#153e2d" font-size="42" font-weight="700"><tspan x="86" dy="0">开</tspan></text><text x="164" y="103" fill="#ffffff" font-size="47" font-weight="700"><tspan x="164" dy="0">开机电竞</tspan></text><text x="72" y="195" fill="#ffffff" font-size="58" font-weight="700"><tspan x="72" dy="0">玩家 · 功能说明</tspan></text><text x="74" y="251" fill="#c9dfd1" font-size="27" font-weight="500"><tspan x="74" dy="0">发现服务、发布需求、下单沟通、验收及售后。</tspan></text><text x="76" y="366" fill="#607568" font-size="29" font-weight="500"><tspan x="76" dy="0">10项业务能力 · 标题与说明均来自当前源码</tspan></text><rect x="76" y="432" width="1448" height="124" rx="20" fill="#e4eee5" stroke="none" stroke-width="2"/><text x="100" y="507" fill="#25845b" font-size="58" font-weight="700"><tspan x="100" dy="0">01</tspan></text><text x="205" y="488" fill="#173e2d" font-size="39" font-weight="700"><tspan x="205" dy="0">玩家</tspan></text><text x="205" y="529" fill="#607568" font-size="25" font-weight="500"><tspan x="205" dy="0">发现服务、发布需求、下单沟通、验收及售后。</tspan></text><path d="M800,556 V577 M430.5,577 H1169.5" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M430.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M1169.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><rect x="76" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">多游戏服务筛选浏览</tspan></text><text x="100" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">按游戏、服务分类和关键词查找服务，支持价格</tspan><tspan x="100" dy="40">及成交排序。</tspan></text><rect x="815" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">服务详情与评价浏览</tspan></text><text x="839" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">查看封面图文、价格、服务方与保障标识，并浏</tspan><tspan x="839" dy="40">览真实订单评价。</tspan></text><rect x="76" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">自定义需求预算发布</tspan></text><text x="100" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">写明游戏、服务目标和预算，付款后进入公开接</tspan><tspan x="100" dy="40">单大厅等待认领。</tspan></text><rect x="815" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">按服务下单确认约定</tspan></text><text x="839" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">选择服务数量并填写需求与验收标准，生成保留</tspan><tspan x="839" dy="40">服务快照的订单。</tspan></text><rect x="76" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">订单微信与余额支付</tspan></text><text x="100" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">核对订单金额后选择微信或钱包付款，付款结果</tspan><tspan x="100" dy="40">以服务端核实为准。</tspan></text><rect x="815" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">订单进度与记录查看</tspan></text><text x="839" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">按买家或接单身份筛选订单，查看履约阶段、服</tspan><tspan x="839" dy="40">务约定和交付记录。</tspan></text><rect x="76" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">订单独立聊天与证据</tspan></text><text x="100" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">交易双方在独立聊天室沟通，可发送文字和图片</tspan><tspan x="100" dy="40">并保留履约证据。</tspan></text><rect x="815" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">服务验收与真实评价</tspan></text><text x="839" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">核对服务方交付说明后确认完成，符合条件的已</tspan><tspan x="839" dy="40">完成订单可评价。</tspan></text><rect x="76" y="1588" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1588" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1637" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">退款协商与平台介入</tspan></text><text x="100" y="1699" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">支持取消未接单订单、提出退款和补充证据，争</tspan><tspan x="100" dy="40">议可提交平台处理。</tspan></text><rect x="815" y="1588" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1588" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1637" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">玩家主页与资料完善</tspan></text><text x="839" y="1699" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">维护头像昵称、简介与主页封面，公开主页展示</tspan><tspan x="839" dy="40">服务及认证信息。</tspan></text><path d="M76,1886 H1524" stroke="#b7cdbd" stroke-width="2"/><text x="76" y="1940" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">功能按当前源码梳理；微信支付、转账、订阅、小程序码与AI审核需完成对应正式配置。</tspan></text><text x="76" y="1983" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">节点均附功能说明；总图箭头表示业务流程，分组连接线表示能力归属。</tspan></text></svg>