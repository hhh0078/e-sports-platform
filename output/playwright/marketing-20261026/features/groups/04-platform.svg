<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3296" viewBox="0 0 1600 3296" role="img" aria-label="开机电竞项目功能说明"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#25845b"/></marker></defs><style>text{font-family:"Hiragino Sans GB","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f3f5f1"/><rect x="0" y="0" width="1600" height="302" rx="0" fill="#153e2d" stroke="none" stroke-width="2"/><rect x="72" y="54" width="66" height="66" rx="14" fill="#75d4a8" stroke="none" stroke-width="2"/><text x="86" y="102" fill="#153e2d" font-size="42" font-weight="700"><tspan x="86" dy="0">开</tspan></text><text x="164" y="103" fill="#ffffff" font-size="47" font-weight="700"><tspan x="164" dy="0">开机电竞</tspan></text><text x="72" y="195" fill="#ffffff" font-size="58" font-weight="700"><tspan x="72" dy="0">平台后台 · 功能说明</tspan></text><text x="74" y="251" fill="#c9dfd1" font-size="27" font-weight="500"><tspan x="74" dy="0">经营总览、17个独立模块，以及资金审核和交易规则。</tspan></text><text x="76" y="366" fill="#607568" font-size="29" font-weight="500"><tspan x="76" dy="0">20项业务能力 · 标题与说明均来自当前源码</tspan></text><rect x="76" y="432" width="1448" height="124" rx="20" fill="#e4eee5" stroke="none" stroke-width="2"/><text x="100" y="507" fill="#25845b" font-size="58" font-weight="700"><tspan x="100" dy="0">04</tspan></text><text x="205" y="488" fill="#173e2d" font-size="39" font-weight="700"><tspan x="205" dy="0">平台后台</tspan></text><text x="205" y="529" fill="#607568" font-size="25" font-weight="500"><tspan x="205" dy="0">经营总览、17个独立模块，以及资金审核和交易规则。</tspan></text><path d="M800,556 V577 M430.5,577 H1169.5" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M430.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M1169.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><rect x="76" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">经营总览与周期统计</tspan></text><text x="100" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">查看注册、订单、待办和服务成交趋势，支持七</tspan><tspan x="100" dy="40">天、三十天及自定义周期。</tspan></text><rect x="815" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">公共信息与轮播运营</tspan></text><text x="839" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">统一配置平台和游戏轮播、首页公告、四页提示</tspan><tspan x="839" dy="40">及服务需求注意事项。</tspan></text><rect x="76" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">文章草稿发布与管理</tspan></text><text x="100" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">编辑安全Markdown文章、预览正文并管理发布</tspan><tspan x="100" dy="40">状态，更新内容进入审核。</tspan></text><rect x="815" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">图文审核队列与处置</tspan></text><text x="839" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">查看完整待审图文，人工通过或拒绝并填写原因，</tspan><tspan x="839" dy="40">也可重试模型审核。</tspan></text><rect x="76" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">用户资料权限与风控</tspan></text><text x="100" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">搜索用户、编辑基础资料、冻结账号及授撤副管</tspan><tspan x="100" dy="40">理员，并查看订单资金。</tspan></text><rect x="815" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">服务状态审核与下架</tspan></text><text x="839" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">按状态搜索服务，查看发布者和详情，处理通过、</tspan><tspan x="839" dy="40">拒绝与暂停上架。</tspan></text><rect x="76" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">俱乐部审批与认证管理</tspan></text><text x="100" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">审核俱乐部申请、授予或撤销平台认证，并查看</tspan><tspan x="100" dy="40">团队主页、成员和订单。</tspan></text><rect x="815" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">平台订单与售后裁决</tspan></text><text x="839" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">检索订单和售后记录，审阅双方证据，按实际情</tspan><tspan x="839" dy="40">况裁决退款或继续履约。</tspan></text><rect x="76" y="1588" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1588" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1637" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">游戏分类主题素材配置</tspan></text><text x="100" y="1699" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">维护游戏分类、主题颜色、图标和封面素材，管</tspan><tspan x="100" dy="40">理展示顺序与可见状态。</tspan></text><rect x="815" y="1588" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1588" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1637" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">微信商家转账参数配置</tspan></text><text x="839" y="1699" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">维护获批转账场景、报备字段及回调信息，为收</tspan><tspan x="839" dy="40">入提现提供通道配置。</tspan></text><rect x="76" y="1832" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1832" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1881" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">微信支付商户安全配置</tspan></text><text x="100" y="1943" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">管理商户公开参数、证书和密钥配置状态，秘密</tspan><tspan x="100" dy="40">字段加密保存且不回显。</tspan></text><rect x="815" y="1832" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1832" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1881" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">用户协议隐私版本管理</tspan></text><text x="839" y="1943" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">维护用户协议和隐私政策内容及版本，登录时记</tspan><tspan x="839" dy="40">录用户主动同意的版本。</tspan></text><rect x="76" y="2076" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="2076" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="2125" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">平台名称与基础公告</tspan></text><text x="100" y="2187" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">维护平台展示名称和基础公告，保存后的公共配</tspan><tspan x="100" dy="40">置用于前台统一展示。</tspan></text><rect x="815" y="2076" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="2076" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="2125" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">管理员操作日志审计</tspan></text><text x="839" y="2187" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">分页搜索平台管理操作记录，核对操作者、业务</tspan><tspan x="839" dy="40">对象及具体处理说明。</tspan></text><rect x="76" y="2320" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="2320" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="2369" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">图文审核模型接入配置</tspan></text><text x="100" y="2431" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">配置兼容模型接口、提示词和审核选项，可由服</tspan><tspan x="100" dy="40">务端测试已保存连接。</tspan></text><rect x="815" y="2320" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="2320" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="2369" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">平台消息群发定向通知</tspan></text><text x="839" y="2431" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">平台管理员向指定账号或有效用户群发站内消息，</tspan><tspan x="839" dy="40">发送结果保留记录。</tspan></text><rect x="76" y="2564" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="2564" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="2613" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">平台在线客服渠道配置</tspan></text><text x="100" y="2675" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">维护业务客服二维码、电话和微信号，配合小程</tspan><tspan x="100" dy="40">序官方客服入口接待。</tspan></text><rect x="815" y="2564" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="2564" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="2613" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">微信订阅模板发送管理</tspan></text><text x="839" y="2675" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">同步官方模板、配置六类业务映射，查看发送记</tspan><tspan x="839" dy="40">录并安全重试可重试项。</tspan></text><rect x="76" y="2808" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="2808" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="2857" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">个人组织提现资金审核</tspan></text><text x="100" y="2919" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">集中处理个人和组织提现，逐笔查看付款来源、</tspan><tspan x="100" dy="40">资金占用并审核转账。</tspan></text><rect x="815" y="2808" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="2808" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="2857" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">平台费率与押金规则</tspan></text><text x="839" y="2919" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">配置自由和挂靠订单抽成及平台押金门槛，单笔</tspan><tspan x="839" dy="40">订单按规则锁定费率。</tspan></text><path d="M76,3106 H1524" stroke="#b7cdbd" stroke-width="2"/><text x="76" y="3160" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">功能按当前源码梳理；微信支付、转账、订阅、小程序码与AI审核需完成对应正式配置。</tspan></text><text x="76" y="3203" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">节点均附功能说明；总图箭头表示业务流程，分组连接线表示能力归属。</tspan></text></svg>