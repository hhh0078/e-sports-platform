<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2320" viewBox="0 0 1600 2320" role="img" aria-label="开机电竞项目功能说明"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#25845b"/></marker></defs><style>text{font-family:"Hiragino Sans GB","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f3f5f1"/><rect x="0" y="0" width="1600" height="302" rx="0" fill="#153e2d" stroke="none" stroke-width="2"/><rect x="72" y="54" width="66" height="66" rx="14" fill="#75d4a8" stroke="none" stroke-width="2"/><text x="86" y="102" fill="#153e2d" font-size="42" font-weight="700"><tspan x="86" dy="0">开</tspan></text><text x="164" y="103" fill="#ffffff" font-size="47" font-weight="700"><tspan x="164" dy="0">开机电竞</tspan></text><text x="72" y="195" fill="#ffffff" font-size="58" font-weight="700"><tspan x="72" dy="0">俱乐部 · 功能说明</tspan></text><text x="74" y="251" fill="#c9dfd1" font-size="27" font-weight="500"><tspan x="74" dy="0">组织入驻、成员认证、团队协作与独立资金管理。</tspan></text><text x="76" y="366" fill="#607568" font-size="29" font-weight="500"><tspan x="76" dy="0">11项业务能力 · 标题与说明均来自当前源码</tspan></text><rect x="76" y="432" width="1448" height="124" rx="20" fill="#e4eee5" stroke="none" stroke-width="2"/><text x="100" y="507" fill="#25845b" font-size="58" font-weight="700"><tspan x="100" dy="0">03</tspan></text><text x="205" y="488" fill="#173e2d" font-size="39" font-weight="700"><tspan x="205" dy="0">俱乐部</tspan></text><text x="205" y="529" fill="#607568" font-size="25" font-weight="500"><tspan x="205" dy="0">组织入驻、成员认证、团队协作与独立资金管理。</tspan></text><path d="M800,556 V577 M430.5,577 H1169.5" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M430.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M1169.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><rect x="76" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">俱乐部发现与公开主页</tspan></text><text x="100" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">浏览团队介绍、覆盖游戏、认证成员与服务，通</tspan><tspan x="100" dy="40">过公开主页了解团队。</tspan></text><rect x="815" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">俱乐部创建与平台认证</tspan></text><text x="839" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">先保存团队草稿，按平台规则缴纳所需押金，再</tspan><tspan x="839" dy="40">提交平台审核认证。</tspan></text><rect x="76" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">俱乐部装修与游戏覆盖</tspan></text><text x="100" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">负责人维护团队封面、图文介绍和覆盖游戏，保</tspan><tspan x="100" dy="40">存后进入内容审核。</tspan></text><rect x="815" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">入会门槛与团队抽成</tspan></text><text x="839" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">设置成员押金、考核要求、加入说明和团队佣金，</tspan><tspan x="839" dy="40">申请人确认规则。</tspan></text><rect x="76" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">成员申请考核与审核</tspan></text><text x="100" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">处理加入申请并记录审核说明，按考核要求认证、</tspan><tspan x="100" dy="40">拒绝或移除成员。</tspan></text><rect x="815" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">成员资料与范围账单</tspan></text><text x="839" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">查看成员本组织订单、收入和托管押金，成员详</tspan><tspan x="839" dy="40">情不暴露全局钱包。</tspan></text><rect x="76" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">负责人副管理员协作</tspan></text><text x="100" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">负责人可授撤组织副管理员，管理权限按实时身</tspan><tspan x="100" dy="40">份及成员关系校验。</tspan></text><rect x="815" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">团队订单与履约协助</tspan></text><text x="839" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">管理者查看挂靠产生的团队订单，进入订单聊天</tspan><tspan x="839" dy="40">协助沟通与争议处理。</tspan></text><rect x="76" y="1588" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1588" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1637" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">俱乐部佣金与提现管理</tspan></text><text x="100" y="1699" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">组织佣金按进行中、结算中和可提现展示，提现</tspan><tspan x="100" dy="40">收款绑定俱乐部负责人。</tspan></text><rect x="815" y="1588" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1588" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1637" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">成员押金缴纳与退还</tspan></text><text x="839" y="1699" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">成员依加入规则缴纳托管押金，可查询支付进度</tspan><tspan x="839" dy="40">并按条件申请退还。</tspan></text><rect x="76" y="1832" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1832" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1881" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">团队客服与联系方式</tspan></text><text x="100" y="1943" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">维护团队客服二维码、电话与微信号，公开主页</tspan><tspan x="100" dy="40">提供可用的联络入口。</tspan></text><path d="M76,2130 H1524" stroke="#b7cdbd" stroke-width="2"/><text x="76" y="2184" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">功能按当前源码梳理；微信支付、转账、订阅、小程序码与AI审核需完成对应正式配置。</tspan></text><text x="76" y="2227" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">节点均附功能说明；总图箭头表示业务流程，分组连接线表示能力归属。</tspan></text></svg>