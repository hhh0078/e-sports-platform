<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1832" viewBox="0 0 1600 1832" role="img" aria-label="开机电竞项目功能说明"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#25845b"/></marker></defs><style>text{font-family:"Hiragino Sans GB","PingFang SC",sans-serif}</style><rect width="100%" height="100%" fill="#f3f5f1"/><rect x="0" y="0" width="1600" height="302" rx="0" fill="#153e2d" stroke="none" stroke-width="2"/><rect x="72" y="54" width="66" height="66" rx="14" fill="#75d4a8" stroke="none" stroke-width="2"/><text x="86" y="102" fill="#153e2d" font-size="42" font-weight="700"><tspan x="86" dy="0">开</tspan></text><text x="164" y="103" fill="#ffffff" font-size="47" font-weight="700"><tspan x="164" dy="0">开机电竞</tspan></text><text x="72" y="195" fill="#ffffff" font-size="58" font-weight="700"><tspan x="72" dy="0">接单者 · 功能说明</tspan></text><text x="74" y="251" fill="#c9dfd1" font-size="27" font-weight="500"><tspan x="74" dy="0">同一账号也能提供服务，独立接单或选择俱乐部挂靠。</tspan></text><text x="76" y="366" fill="#607568" font-size="29" font-weight="500"><tspan x="76" dy="0">7项业务能力 · 标题与说明均来自当前源码</tspan></text><rect x="76" y="432" width="1448" height="124" rx="20" fill="#e4eee5" stroke="none" stroke-width="2"/><text x="100" y="507" fill="#25845b" font-size="58" font-weight="700"><tspan x="100" dy="0">02</tspan></text><text x="205" y="488" fill="#173e2d" font-size="39" font-weight="700"><tspan x="205" dy="0">接单者</tspan></text><text x="205" y="529" fill="#607568" font-size="25" font-weight="500"><tspan x="205" dy="0">同一账号也能提供服务，独立接单或选择俱乐部挂靠。</tspan></text><path d="M800,556 V577 M430.5,577 H1169.5" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M430.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><path d="M1169.5,577 V612" stroke="#b7cdbd" stroke-width="3" fill="none"/><rect x="76" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">服务发布与图文预览</tspan></text><text x="100" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">编辑游戏服务、价格及封面文案，预览效果后保</tspan><tspan x="100" dy="40">存并进入内容审核。</tspan></text><rect x="815" y="612" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="612" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="661" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">个人服务编辑与暂停</tspan></text><text x="839" y="723" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">在工作台查看本人服务，修改介绍和价格，暂停</tspan><tspan x="839" dy="40">或恢复该服务上架。</tspan></text><rect x="76" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">公开需求筛选与认领</tspan></text><text x="100" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">浏览玩家已付款需求，核对预算与目标后认领，</tspan><tspan x="100" dy="40">服务端复核接单资格。</tspan></text><rect x="815" y="856" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="856" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="905" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">接单开始交付全流程</tspan></text><text x="839" y="967" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">按订单依次接受、开始服务和提交交付，等待玩</tspan><tspan x="839" dy="40">家核对并确认完成。</tspan></text><rect x="76" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">加减价协商与补退款</tspan></text><text x="100" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">履约中可协商调整费用，经双方确认后补款或退</tspan><tspan x="100" dy="40">差，并保留协商记录。</tspan></text><rect x="815" y="1100" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="815" y="1100" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="839" y="1149" fill="#173e2d" font-size="34" font-weight="700"><tspan x="839" dy="0">接单收入与资金查询</tspan></text><text x="839" y="1211" fill="#607568" font-size="29" font-weight="500"><tspan x="839" dy="0">查看订单进行中收入、待结算与可提现金额，按</tspan><tspan x="839" dy="40">流水核对资金变化。</tspan></text><rect x="76" y="1344" width="709" height="214" rx="20" fill="#ffffff" stroke="#d6e1d8" stroke-width="2"/><rect x="76" y="1344" width="7" height="214" rx="0" fill="#25845b" stroke="none" stroke-width="2"/><text x="100" y="1393" fill="#173e2d" font-size="34" font-weight="700"><tspan x="100" dy="0">独立接单与俱乐部挂靠</tspan></text><text x="100" y="1455" fill="#607568" font-size="29" font-weight="500"><tspan x="100" dy="0">可独立提供服务，也可申请俱乐部认证，认领需</tspan><tspan x="100" dy="40">求时选择有效挂靠。</tspan></text><path d="M76,1642 H1524" stroke="#b7cdbd" stroke-width="2"/><text x="76" y="1696" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">功能按当前源码梳理；微信支付、转账、订阅、小程序码与AI审核需完成对应正式配置。</tspan></text><text x="76" y="1739" fill="#607568" font-size="25" font-weight="500"><tspan x="76" dy="0">节点均附功能说明；总图箭头表示业务流程，分组连接线表示能力归属。</tspan></text></svg>